name: Check tsnet Update

on:
  schedule:
    # 每日北京时间 00:00 (UTC 16:00)
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check-tsnet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check tailscale.com (tsnet) version
        id: check
        run: |
          CURRENT=$(awk '/^require tailscale\.com / {print $3; exit}' go.mod)
          if [ -z "$CURRENT" ]; then
            CURRENT=$(go list -m -mod=readonly -f '{{.Version}}' tailscale.com)
          fi
          LATEST=$(go list -m -mod=mod -f '{{.Version}}' tailscale.com@latest)
          echo "Current version: $CURRENT"
          echo "Latest version:  $LATEST"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" != "$LATEST" ]; then
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update tailscale.com and vendor
        if: steps.check.outputs.updated == 'true'
        run: |
          go get "tailscale.com@${{ steps.check.outputs.latest }}"
          go mod tidy
          go mod vendor

      - name: Setup updated Go
        if: steps.check.outputs.updated == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run unit tests
        if: steps.check.outputs.updated == 'true'
        run: make test

      - name: Commit and push update
        if: steps.check.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum vendor
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): bump tailscale.com to ${{ steps.check.outputs.latest }}"
            git push origin HEAD:main
          fi

      - name: Trigger release workflow
        if: steps.check.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --ref main
